<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>미리보기</title>
<style>html,body{margin:0;padding:0;background:#fff}iframe{border:0;display:block}</style>
</head>
<body>
<script>
  var p = new URLSearchParams(location.search);
  var w = +(p.get('w') || 1440), h = +(p.get('h') || 900), sy = +(p.get('sy') || 0), to = p.get('to') || '';
  var f = document.createElement('iframe');
  f.width = w; f.height = h; f.scrolling = 'no';
  f.style.width = w + 'px'; f.style.height = h + 'px';
  f.src = '/?v=' + (p.get('v') || 'preview') + (to ? '#' + to : '');
  f.addEventListener('load', function(){ if (sy) { setTimeout(function(){ try { f.contentWindow.scrollTo(0, sy); } catch(e){} }, 400); } });
  document.body.appendChild(f);
</script>
</body>
</html>
